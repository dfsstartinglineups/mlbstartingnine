name: Build Bullpen HTML Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-bullpen-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run HTML Generator
        run: |
          python scripts/build_bullpen_pages.py

      - name: Commit and Push Generated Pages
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add teams/
          git add sitemap.xml || true
          git add data/updates_queue.json || true
          git diff-index --quiet HEAD || git commit -m "Automated update: Built static bullpen HTML pages"
          git push
