name: Gather Bullpen Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gather-bullpen-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: Run Bullpen Data Gatherer
        run: |
          python scripts/gather_bullpen_data.py

      - name: Commit and Push Bullpen Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/bullpen_data.json
          git diff-index --quiet HEAD || git commit -m "Automated update: Bullpen data JSON"
          git push
